workflows:
  ios-unsigned:
    name: iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Run Dart checks
        script: |
          flutter analyze
          flutter test
      - name: Run iOS native regression tests
        script: |
          set -euo pipefail
          flutter build ios --simulator --debug
          simulator_id="$(xcrun simctl list devices available -j | ruby -rjson -e 'device = JSON.parse(STDIN.read).fetch("devices").values.flatten.find { |item| item.fetch("name").start_with?("iPhone") && item.fetch("isAvailable") }; abort "No available iPhone simulator" unless device; puts device.fetch("udid")')"
          mkdir -p "$CM_BUILD_DIR/build/ios/test-results"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" -parallel-testing-enabled NO \
            -resultBundlePath "$CM_BUILD_DIR/build/ios/test-results/RunnerTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$CM_BUILD_DIR/build/ios/test-results/native-regression.log"
      - name: Build iOS app and Shortcuts action
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          app_path="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          ipa_path="$CM_BUILD_DIR/build/ios/ipa/luckinstocktaking-unsigned.ipa"
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          test ! -d "$app_path/PlugIns/StockKeyboard.appex"
          test ! -d "$app_path/PlugIns/StockCapture.appex"
          test -d "$app_path/Metadata.appintents"
          mkdir -p "$package_dir/Payload"
          cp -R "$app_path" "$package_dir/Payload/Runner.app"
          mkdir -p "$(dirname "$ipa_path")"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$package_dir/Payload" "$ipa_path"
          test -s "$ipa_path"
    artifacts:
      - build/ios/ipa/luckinstocktaking-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/test-results/*.xcresult
      - build/ios/test-results/*.log
